version: 2
models:
- name: int_ga4__sessions
  description: Events rolled up to one row per session, with session source and landing page.
  columns:
  - name: session_key
    data_tests:
    - unique
    - not_null
  - name: session_start_ts
    data_tests:
    - not_null
  - name: distinct_session_numbers
    description: Distinct ga_session_number values seen in the session; should be 1.
    data_tests:
    - dbt_utils.accepted_range:
        arguments:
          max_value: 1
        config:
          severity: warn
  - name: attribution_basis
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - session_start_params
          - other_event_params
          - not_logged
- name: int_ga4__purchases
  description: One row per purchase event, with purchase_status = counted / duplicate / missing_transaction_id.
    Orders are identified by order_key (transaction_id + user_pseudo_id).
  columns:
  - name: purchase_status
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - counted
          - duplicate
          - missing_transaction_id
  - name: purchase_event_key
    data_tests:
    - not_null
  - name: revenue_usd
    description: purchase_revenue_in_usd as NUMERIC cents; NULL when GA4 sent none.
    data_tests:
    - not_null:
        config:
          severity: warn
          where: purchase_status = 'counted'
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
        config:
          where: revenue_usd is not null
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - order_key
      config:
        where: purchase_status = 'counted'
