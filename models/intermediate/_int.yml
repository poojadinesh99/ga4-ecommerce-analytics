version: 2
models:
- name: int_ga4__sessions
  description: Events rolled up to one row per session, with session source and landing page.
  columns:
  - name: session_key
    data_tests:
    - unique
    - not_null
  - name: session_start_ts
    data_tests:
    - not_null
- name: int_ga4__purchases
  description: One row per purchase event, with purchase_status = counted / duplicate / missing_transaction_id.
    Single place where purchases are deduplicated.
  columns:
  - name: purchase_status
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - counted
          - duplicate
          - missing_transaction_id
  - name: revenue_usd
    data_tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - transaction_id
      config:
        where: purchase_status = 'counted'
