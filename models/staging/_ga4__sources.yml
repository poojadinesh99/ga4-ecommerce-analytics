version: 2

sources:
  - name: ga4
    description: >
      Google Analytics 4 BigQuery export for the Google Merchandise Store
      (obfuscated public sample, 2020-11-01 to 2021-01-31).
    database: bigquery-public-data
    schema: ga4_obfuscated_sample_ecommerce
    tables:
      - name: events
        identifier: "events_*"
        description: Date-sharded GA4 event tables (one row per event).
        columns:
          - name: event_name
            data_tests: [not_null]
          - name: user_pseudo_id
            data_tests: [not_null]
